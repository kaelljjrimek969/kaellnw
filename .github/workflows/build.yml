      - name: Kernel-level memory defaults
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          def patch(path, pairs):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  print('MISSING', path); return
              n = s
              for old, new in pairs:
                  n = n.replace(old, new)
              if n != s:
                  open(path, 'w').write(n); print('patched', path)
              else:
                  print('::warning::tidak ada perubahan di', path)
          patch('mm/swap.c', [('page_cluster = 3;', 'page_cluster = 0;'),
                              ('page_cluster = 2;', 'page_cluster = 0;')])
          patch('fs/dcache.c', [('int sysctl_vfs_cache_pressure __read_mostly = 100;',
                                 'int sysctl_vfs_cache_pressure __read_mostly = 50;')])
          patch('mm/swap_state.c', [('static bool enable_vma_readahead __read_mostly = true;',
                                     'static bool enable_vma_readahead __read_mostly = false;')])
          patch('include/linux/mm.h', [('(SZ_128K / PAGE_SIZE)', '(SZ_512K / PAGE_SIZE)')])
          PYEOF

      - name: Clamp vfs_cache_pressure (tolak tulisan init > 50)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          p = 'kernel/sysctl.c'
          s = open(p).read()
          m = re.search(r'\.procname\s*=\s*"vfs_cache_pressure",', s)
          assert m, 'entry vfs_cache_pressure tidak ditemukan'
          end = s.index('},', m.end())
          entry = s[m.start():end]
          assert 'proc_dointvec_minmax' in entry, 'handler bukan minmax'
          k = s.index('.extra1', m.end())
          assert k < end, '.extra1 tidak ada di entry'
          eol = s.index('\n', k)
          s = s[:eol] + '\n\t\t.extra2\t\t= &kz_vfs_max,' + s[eol:]
          t = s.index('static struct ctl_table vm_table[]')
          s = s[:t] + 'static int kz_vfs_max = 50; /* Kaelltzyy */\n' + s[t:]
          open(p, 'w').write(s)
          print('vfs_cache_pressure di-clamp max 50')
          PYEOF
          grep -n "kz_vfs_max" kernel/sysctl.c

      - name: Force ZRAM compressor lz4
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = 'drivers/block/zram/zram_drv.c'
          s = open(p).read()
          old = 'strlcpy(compressor, buf, sizeof(compressor));'
          if old in s and 'Kaelltzyy lz4' not in s:
              s = s.replace(old, old + ' strlcpy(compressor, "lz4", sizeof(compressor)); /* Kaelltzyy lz4 */', 1)
              open(p, 'w').write(s)
              print('zram comp_algorithm dipaksa lz4')
          else:
              print('::warning::baris comp_algorithm_store tidak ditemukan, lz4 hanya lewat default config')
          PYEOF

      - name: VM defaults (dirty, swappiness, min_free, OOM)
        env:
          SWAP_MAX: "20"
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import os, re
          def sub(path, pat, repl, label):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  print('::warning::file tidak ada:', path); return
              n, c = re.subn(pat, repl, s, count=1)
              if c:
                  open(path, 'w').write(n); print('ok   ', label)
              else:
                  print('::warning::tidak ditemukan, dilewati:', label)

          pw = 'mm/page-writeback.c'
          sub(pw, r'(int\s+vm_dirty_ratio\s*=\s*)\d+;', r'\g<1>10;', 'dirty_ratio=10')
          sub(pw, r'(int\s+dirty_background_ratio\s*=\s*)\d+;', r'\g<1>5;', 'dirty_background_ratio=5')
          sub(pw, r'(dirty_writeback_interval\s*=\s*)[^;]+;', r'\g<1>3 * 100;', 'writeback 3s')
          sub(pw, r'(dirty_expire_interval\s*=\s*)[^;]+;', r'\g<1>5 * 100;', 'dirty_expire 5s')

          sw = os.environ['SWAP_MAX']
          sub('mm/vmscan.c', r'(int\s+vm_swappiness\s*=\s*)\d+;', r'\g<1>' + sw + ';', 'swappiness default ' + sw)
          sub('mm/page_alloc.c',
              r'(new_min_free_kbytes\s*=\s*int_sqrt\(lowmem_kbytes\s*\*\s*16\))\s*;',
              r'\g<1> + 5120; /* Kaelltzyy +5MB */', 'min_free_kbytes +5MB')
          sub('mm/oom_kill.c', r'([ \t]*)/\* Normalize to oom_score_adj units \*/',
              r'\g<1>points >>= 1; /* Kaelltzyy: halve base badness */\n\g<0>', 'oom badness /2')

          p = 'kernel/sysctl.c'
          s = open(p).read()
          m = re.search(r'\.procname\s*=\s*"swappiness",', s)
          if m:
              end = s.index('},', m.end())
              entry = s[m.start():end]
              if re.search(r'\.extra2\s*=\s*[^,]+,', entry):
                  new_entry = re.sub(r'(\.extra2\s*=\s*)[^,]+,', r'\g<1>&kz_swap_max,', entry, count=1)
              else:
                  k = entry.index('.extra1')
                  eol = entry.index('\n', k)
                  new_entry = entry[:eol] + '\n\t\t.extra2\t\t= &kz_swap_max,' + entry[eol:]
              s = s[:m.start()] + new_entry + s[end:]
              t = s.index('static struct ctl_table vm_table[]')
              s = s[:t] + 'static int kz_swap_max = %s; /* Kaelltzyy */\n' % sw + s[t:]
              open(p, 'w').write(s)
              print('ok    swappiness di-clamp max', sw)
          else:
              print('::warning::entry swappiness tidak ditemukan, clamp dilewati')
          PYEOF

      - name: RAM gaming tuning (watermark, boost, compaction)
        if: ${{ inputs.ram_gaming == 'on' }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          def sub(path, pat, repl, label):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  print('::warning::file tidak ada:', path); return
              n, c = re.subn(pat, repl, s, count=1)
              if c:
                  open(path, 'w').write(n); print('ok   ', label)
              else:
                  print('::warning::tidak ditemukan, dilewati:', label)
          # kswapd bangun lebih awal -> kurangi direct reclaim (stall/lag spike saat game)
          sub('mm/page_alloc.c', r'(int\s+watermark_scale_factor\s*=\s*)\d+;',
              r'\g<1>25; /* Kaelltzyy */', 'watermark_scale_factor=25')
          # matikan watermark boost: reclaim agresif setelah fragmentasi bikin frame drop
          sub('mm/page_alloc.c', r'(watermark_boost_factor\s*(?:__read_mostly\s*)?=\s*)\d+;',
              r'\g<1>0; /* Kaelltzyy */', 'watermark_boost_factor=0')
          # proactive compaction = kerja CPU di background, tanpa THP di Android tidak perlu
          sub('mm/compaction.c', r'(sysctl_compaction_proactiveness\s*=\s*)\d+;',
              r'\g<1>0; /* Kaelltzyy */', 'compaction_proactiveness=0')
          PYEOF
          grep -nE "Kaelltzyy" mm/page_alloc.c mm/compaction.c | head

      - name: Turbo schedutil (extra frequency headroom)
        if: ${{ inputs.turbo_headroom != 'off' }}
        run: |
          cd kernel
          f=kernel/sched/cpufreq_schedutil.c
          pat='freq = map_util_freq(util, freq, max);'
          if grep -qF "$pat" "$f"; then
            case "${{ inputs.turbo_headroom }}" in
              strong) extra='freq += freq >> 1;' ;;
              *)      extra='freq += freq >> 2;' ;;
            esac
            sed -i "s|freq = map_util_freq(util, freq, max);|{ freq = map_util_freq(util, freq, max); ${extra} /* Kaelltzyy turbo */ }|" "$f"
            grep -n "Kaelltzyy turbo" "$f"
          else
            echo "::warning::Baris map_util_freq tidak ditemukan, turbo dilewati"
          fi

      - name: Force TCP_NODELAY by default
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = 'net/ipv4/tcp.c'
          s = open(p).read()
          if 'Kaelltzyy nodelay' not in s:
              i = s.index('void tcp_init_sock(struct sock *sk)')
              key = 'tp->out_of_order_queue = RB_ROOT;'
              j = s.index(key, i) + len(key)
              s = s[:j] + '\n\ttp->nonagle |= TCP_NAGLE_OFF; /* Kaelltzyy nodelay */' + s[j:]
              open(p, 'w').write(s)
              print('nodelay patched')
          PYEOF
          grep -n "Kaelltzyy nodelay" net/ipv4/tcp.c

      - name: Thermal - matikan throttling + spoof suhu tampilan (shutdown darurat tetap aktif)
        run: |
          cd kernel

          python3 - <<'PYEOF'
          import re

          # 1) Matikan throttling (governor/cooling device) tapi biarkan
          #    critical/hot trip, jadi shutdown darurat kernel tetap jalan.
          p = 'drivers/thermal/thermal_core.c'
          try:
              s = open(p).read()
          except FileNotFoundError:
              s = None
              print('::warning::thermal_core.c tidak ada, skip')
          if s is not None and 'Kaelltzyy no-throttle' not in s:
              n, c = re.subn(r'(\n[ \t]*)handle_non_critical_trips\(([^;\n]*)\);',
                             r'\1do { } while (0); /* Kaelltzyy no-throttle */', s, count=1)
              if c:
                  n = n.replace('static void handle_non_critical_trips(',
                                'static void __maybe_unused handle_non_critical_trips(', 1)
                  open(p, 'w').write(n)
                  print('ok    throttling non-critical dimatikan (critical shutdown tetap)')
              else:
                  print('::warning::handle_non_critical_trips tidak ditemukan, throttling TIDAK dimatikan')

          # 2) Spoof suhu thermal zone di tampilan sysfs (temp_show)
          p = 'drivers/thermal/thermal_sysfs.c'
          s = open(p).read()
          if 'kaelltzyy_zone_temp' not in s:
              i = s.find('temp_show(struct device *dev')
              old = 'return sprintf(buf, "%d\\n", temperature);'
              j = s.find(old, i) if i >= 0 else -1
              if j >= 0:
                  s = s[:j] + 'return sprintf(buf, "%d\\n", kaelltzyy_zone_temp(temperature));' + s[j + len(old):]
                  decl = ('#ifdef CONFIG_KAELLTZYY\n'
                          'extern int kaelltzyy_zone_temp(int real);\n'
                          '#else\n'
                          'static inline int kaelltzyy_zone_temp(int real) { return real; }\n'
                          '#endif\n')
                  k = list(re.finditer(r'^#include.*\n', s, re.M))[-1].end()
                  s = s[:k] + decl + s[k:]
                  open(p, 'w').write(s)
                  print('ok    spoof suhu thermal zone (temp_show)')
              else:
                  print('::warning::temp_show tidak ditemukan, spoof suhu zone dilewati')

          # 3) Spoof suhu baterai di tampilan sysfs/uevent
          p = 'drivers/power/supply/power_supply_sysfs.c'
          s = open(p).read()
          if 'kaelltzyy_bat_temp' not in s:
              i = s.find('power_supply_show_property(')
              j = s.find('switch (psp) {', i) if i >= 0 else -1
              if j >= 0:
                  ins = ('if (psp == POWER_SUPPLY_PROP_TEMP)\n'
                         '\t\tvalue.intval = kaelltzyy_bat_temp(value.intval);\n\n\t')
                  s = s[:j] + ins + s[j:]
                  decl = ('#ifdef CONFIG_KAELLTZYY\n'
                          'extern int kaelltzyy_bat_temp(int real);\n'
                          '#else\n'
                          'static inline int kaelltzyy_bat_temp(int real) { return real; }\n'
                          '#endif\n')
                  k = list(re.finditer(r'^#include.*\n', s, re.M))[-1].end()
                  s = s[:k] + decl + s[k:]
                  open(p, 'w').write(s)
                  print('ok    spoof suhu baterai (power_supply_show_property)')
              else:
                  print('::warning::power_supply_show_property tidak ditemukan, spoof baterai dilewati')
          PYEOF

          python3 - <<'PYEOF'
          import re, os

          candidates = [
              'drivers/misc/mediatek/thermal/mtk_thermal_monitor.c',
              'drivers/thermal/mtk_thermal.c',
          ]
          for p in candidates:
              if not os.path.exists(p):
                  continue
              s = open(p).read()
              if 'Kaelltzyy no-throttle' in s:
                  print(p, 'sudah dipatch'); break
              n, c = re.subn(
                  r'(static\s+\w+\s+mtk_thermal_set_user_scenarios\b[^{]*\{)',
                  r'\1\n\treturn 0; /* Kaelltzyy no-throttle */',
                  s, count=1)
              if c:
                  open(p, 'w').write(n)
                  print('ok    mtk_thermal_set_user_scenarios noop ->', p)
                  break
          else:
              print('mtk_thermal_set_user_scenarios tidak ada di source ini, skip')
          PYEOF

          # patch MTK di atas menyisipkan return sebelum deklarasi lokal
          # (kernel dibuild dengan -Werror)
          for f in drivers/misc/mediatek/thermal/mtk_thermal_monitor.c drivers/thermal/mtk_thermal.c; do
            if [ -f "$f" ] && grep -q 'Kaelltzyy no-throttle' "$f"; then
              d=$(dirname "$f"); o=$(basename "$f" .c).o
              printf '\nCFLAGS_%s += -Wno-declaration-after-statement -Wno-unused-variable -Wno-unused-function\n' "$o" >> "$d/Makefile"
            fi
          done

          grep -n "kaelltzyy_zone_temp\|kaelltzyy_bat_temp\|Kaelltzyy no-throttle" \
            drivers/thermal/thermal_core.c drivers/thermal/thermal_sysfs.c \
            drivers/power/supply/power_supply_sysfs.c || true

      - name: Temp spoof default (suhu tampilan)
        env:
          C: ${{ inputs.spoof_temp_c }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import os
          p = 'drivers/misc/kaelltzyy.c'
          s = open(p).read()
          v = os.environ.get('C', '').strip()
          if not v:
              s = s.replace('static bool temp_spoof = true;', 'static bool temp_spoof = false;')
              print('temp spoof dimatikan')
          else:
              n = max(-40, min(60, int(v)))
              old = 'static int temp_spoof_mc = 15000;'
              assert old in s
              s = s.replace(old, 'static int temp_spoof_mc = %d;' % (n * 1000))
              print('temp spoof default =', n, 'C')
          open(p, 'w').write(s)
          PYEOF
          grep -n "temp_spoof" drivers/misc/kaelltzyy.c | head

      - name: Apply BORE patch
        if: ${{ inputs.bore_patch_url != '' }}
        run: |
          cd kernel
          P="$GITHUB_WORKSPACE/bore.patch"
          B="$GITHUB_WORKSPACE/bore_backup"
          NF="$GITHUB_WORKSPACE/bore_newfiles"
          rm -rf "$B" "$NF"; mkdir -p "$B"
          if ! curl -fL --retry 3 "${{ inputs.bore_patch_url }}" -o "$P"; then
            echo "::warning::Download patch BORE gagal, dilewati"; exit 0
          fi
          if head -c 300 "$P" | grep -qiE '<html|<!doctype'; then
            echo "::warning::URL BORE mengembalikan HTML (pakai link raw, bukan blob), dilewati"; exit 0
          fi
          grep -E '^\+\+\+ ' "$P" | awk '{print $2}' | sed 's|^[ab]/||' | grep -v '^/dev/null$' | sort -u | \
          while read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "$B/$(dirname "$f")"; cp -p "$f" "$B/$f"
            else
              echo "$f" >> "$NF"
            fi
          done
          ok=0
          if git apply --check "$P" 2>/dev/null; then
            git apply "$P" && ok=1
          elif patch -p1 -F3 --no-backup-if-mismatch --dry-run < "$P" >/dev/null 2>&1; then
            echo "git apply gagal, pakai patch -F3 (fuzz)"
            patch -p1 -F3 --no-backup-if-mismatch < "$P" && ok=1
          else
            git apply --check "$P" 2>&1 | head -20 || true
          fi
          if [ "$ok" != 1 ]; then
            echo "::warning::Patch BORE tidak cocok dengan source ini, dilewati"; exit 0
          fi
          if grep -rqE '^config SCHED_BORE' init/Kconfig kernel/Kconfig* kernel/sched 2>/dev/null; then
            echo "CONFIG_SCHED_BORE=y" >> arch/arm64/configs/${{ inputs.defconfig }}
          else
            echo "::warning::Kconfig SCHED_BORE tidak ditemukan, patch dianggap selalu aktif"
          fi
          touch .applied_bore
          echo "BORE terpasang"

      - name: Apply BBRv3 patch
        if: ${{ inputs.bbr3_patch_url != '' }}
        run: |
          cd kernel
          if curl -fL --retry 3 "${{ inputs.bbr3_patch_url }}" -o bbr3.patch \
              && git apply --check bbr3.patch && git apply bbr3.patch; then
            touch .applied_bbr3
          else
            echo "::warning::Patch BBRv3 gagal dipasang (URL salah / tidak cocok), dilewati"
          fi

      - name: Apply ADIOS patch
        if: ${{ inputs.adios_patch_url != '' }}
        run: |
          cd kernel
          if curl -fL --retry 3 "${{ inputs.adios_patch_url }}" -o adios.patch \
              && git apply --check adios.patch && git apply adios.patch; then
            touch .applied_adios
          else
            echo "::warning::Patch ADIOS gagal dipasang (URL salah / tidak cocok), dilewati"
          fi

      - name: Gaming IO - default I/O scheduler
        if: ${{ inputs.io_default != 'keep' }}
        env:
          IOS: ${{ inputs.io_default }}
        run: |
          cd kernel
          if [ "$IOS" = "auto" ]; then
            if [ -f .applied_adios ]; then IOS=adios; else IOS=kyber; fi
          fi
          if [ "$IOS" = "adios" ] && [ ! -f .applied_adios ]; then
            echo "::warning::io_default=adios tapi patch ADIOS tidak terpasang (isi adios_patch_url), pakai kyber"
            IOS=kyber
          fi
          echo "I/O default dipilih: $IOS"
          echo "$IOS" > .io_default
          export IOS
          python3 - <<'PYEOF'
          import os, re
          p = 'block/elevator.c'
          try:
              s = open(p).read()
          except FileNotFoundError:
              print('::warning::block/elevator.c tidak ada, dilewati'); raise SystemExit
          name = os.environ['IOS']
          n, c = re.subn(r'(elevator_get\(q,\s*)"mq-deadline"(,\s*false\))', r'\1"%s"\2' % name, s, count=1)
          if c:
              open(p, 'w').write(n)
              print('ok    default I/O scheduler untuk single-queue =', name)
          else:
              print('::warning::elevator_get mq-deadline tidak ditemukan, I/O default dilewati')
          PYEOF
          grep -n 'elevator_get(q, "' block/elevator.c | head -3

      - name: Apply touch boost patch
        if: ${{ inputs.touch_boost_patch_url != '' }}
        run: |
          cd kernel
          if curl -fL --retry 3 "${{ inputs.touch_boost_patch_url }}" -o touch_boost.patch \
              && git apply --check touch_boost.patch && git apply touch_boost.patch; then
            echo "touch boost terpasang"
          else
            echo "::warning::Patch touch boost gagal dipasang (URL salah / tidak cocok), dilewati"
          fi

      - name: Gaming network defaults (anti-lag)
        if: ${{ inputs.gaming_tweaks == 'on' }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          p = 'net/ipv4/tcp_ipv4.c'
          s = open(p).read()
          n, c1 = re.subn(r'(net->ipv4\.sysctl_tcp_slow_start_after_idle\s*=\s*)1;',
                          r'\g<1>0; /* Kaelltzyy gaming */', s)
          n, c2 = re.subn(r'(net->ipv4\.sysctl_tcp_fastopen\s*=\s*)TFO_CLIENT_ENABLE;',
                          r'\g<1>TFO_CLIENT_ENABLE | TFO_SERVER_ENABLE; /* Kaelltzyy gaming */', n)
          n, c3 = re.subn(r'(net->ipv4\.sysctl_tcp_autocorking\s*=\s*)1;',
                          r'\g<1>0; /* Kaelltzyy gaming */', n)
          if c1 + c2 + c3:
              open(p, 'w').write(n)
          print('slow_start_after_idle=0:', bool(c1), '| fastopen=3:', bool(c2),
                '| autocorking=0:', bool(c3))
          if not c1:
              print('::warning::slow_start_after_idle tidak ditemukan, dilewati')
          if not c2:
              print('::warning::tcp_fastopen default tidak ditemukan, dilewati')
          PYEOF

      - name: Integrate KernelSU-Next
        if: ${{ inputs.kernelsu != 'off' }}
        run: |
          cd kernel
          URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          if [ "${{ inputs.susfs }}" = "on" ]; then
            # Branch polos 'next'/tag stabil TIDAK punya hook SUSFS -> wajib branch susfs
            curl -fLSs --retry 5 --retry-all-errors "$URL" | bash -s "${{ inputs.ksu_susfs_branch }}"
          elif [ "${{ inputs.kernelsu }}" = "next" ]; then
            curl -fLSs --retry 5 --retry-all-errors "$URL" | bash -s next
          else
            curl -fLSs --retry 5 --retry-all-errors "$URL" | bash -
          fi
          ls -la drivers | grep -i kernelsu
          git -C KernelSU-Next log -1 --oneline
          git -C KernelSU-Next describe --tags --always
          if [ "${{ inputs.susfs }}" = "on" ]; then
            if ! grep -rqi "susfs" KernelSU-Next/kernel; then
              echo "::error::Branch KernelSU-Next '${{ inputs.ksu_susfs_branch }}' tidak mengandung kode SUSFS. Cek nama branch di repo KernelSU-Next."
              exit 1
            fi
            echo "KSU-Next sisi SUSFS: OK"
          fi

      - name: Integrate SUSFS (kernel side)
        if: ${{ inputs.kernelsu != 'off' && inputs.susfs == 'on' }}
        run: |
          cd kernel
          if [ -f fs/susfs.c ] && [ -f include/linux/susfs.h ]; then
            echo "Source sudah punya SUSFS, skip patch kernel"
          else
            git clone --depth=1 -b "${{ inputs.susfs_kernel_branch }}" \
              https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"
            KP="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
            cp -v "$KP"/fs/* fs/
            cp -v "$KP"/include/linux/* include/linux/
            PATCH=$(ls "$KP"/50_add_susfs_in_gki-*.patch | head -1)
            echo "Patch: $PATCH"
            if ! patch -p1 --dry-run < "$PATCH"; then
              echo "::error::Patch SUSFS kernel-side tidak cocok dengan source ini (hunk gagal). Perlu rebase manual."
              exit 1
            fi
            patch -p1 < "$PATCH"
          fi
          grep -rn "SUSFS_VERSION" include/linux/susfs*.h | head -3 || true
          [ -f fs/susfs.c ] || { echo "::error::fs/susfs.c tidak ada"; exit 1; }

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64 KBUILD_BUILD_USER=kaelltzyy KBUILD_BUILD_HOST=github
          export ARGS="O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          if [ "${{ inputs.opt_o3 }}" = "on" ]; then export ARGS="$ARGS KCFLAGS=-O3"; fi
          cat > "$GITHUB_WORKSPACE/do_build.sh" <<'BEOF'
          set -e
          make $ARGS ${{ inputs.defconfig }}
          LVN="-Kaelltzyy"
          if [ "${{ inputs.kernelsu }}" != "off" ]; then LVN="-Kaelltzyy-KSUN"; fi
          if [ "${{ inputs.kernelsu }}" != "off" ] && [ "${{ inputs.susfs }}" = "on" ]; then LVN="${LVN}-SUSFS"; fi
          scripts/config --file out/.config --set-str LOCALVERSION "$LVN" -d LOCALVERSION_AUTO
          if [ "${{ inputs.lto_mode }}" = "none" ]; then
            scripts/config --file out/.config \
              -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE -d CFI_CLANG
          else
            scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          fi
          if [ "${{ inputs.kernelsu }}" != "off" ]; then
            scripts/config --file out/.config \
              -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          fi
          if [ "${{ inputs.kernelsu }}" != "off" ] && [ "${{ inputs.susfs }}" = "on" ]; then
            # Simbol yang tidak ada di versi SUSFS ini akan dibuang diam-diam oleh olddefconfig (aman)
            for sym in KSU_SUSFS KSU_SUSFS_HAS_MAGIC_MOUNT KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
                       KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                       KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
                       KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
              scripts/config --file out/.config -e "$sym"
            done
            # SPOOF_UNAME sengaja off: bentrok dengan uname spoof driver kaelltzyy
            scripts/config --file out/.config -d KSU_SUSFS_SPOOF_UNAME -d KSU_SUSFS_ENABLE_LOG
          fi
          if [ "${{ inputs.disable_debug }}" = "on" ]; then
            # DEBUG_INFO_BTF butuh DEBUG_INFO: kalau BTF aktif, DEBUG_INFO dibiarkan
            if grep -q '^CONFIG_DEBUG_INFO_BTF=y' out/.config; then
              echo "::warning::DEBUG_INFO_BTF aktif di defconfig, DEBUG_INFO dibiarkan (BTF butuh itu)"
            else
              scripts/config --file out/.config \
                -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5 \
                -d DEBUG_INFO_REDUCED -d DEBUG_INFO_SPLIT -e DEBUG_INFO_NONE
            fi
            scripts/config --file out/.config \
              -d KASAN -d UBSAN -d KCSAN -d KFENCE -d DEBUG_KMEMLEAK \
              -d PROVE_LOCKING -d LOCKDEP -d DEBUG_LOCK_ALLOC -d LOCK_STAT \
              -d DEBUG_SPINLOCK -d DEBUG_MUTEXES -d DEBUG_RT_MUTEXES \
              -d DEBUG_WW_MUTEX_SLOWPATH -d DEBUG_ATOMIC_SLEEP -d DEBUG_PREEMPT \
              -d DEBUG_LIST -d DEBUG_SG -d DEBUG_NOTIFIERS -d DEBUG_CREDENTIALS \
              -d DEBUG_OBJECTS -d DEBUG_VM -d DEBUG_PAGEALLOC -d DEBUG_STACK_USAGE \
              -d PAGE_OWNER -d PAGE_POISONING -d SLUB_DEBUG_ON -d SCHEDSTATS \
              -d LATENCYTOP -d PM_DEBUG -d PM_ADVANCED_DEBUG -d DEBUG_SHIRQ \
              -d WQ_WATCHDOG -d SOFTLOCKUP_DETECTOR -d HARDLOCKUP_DETECTOR \
              -d PANIC_ON_OOPS -d BUG_ON_DATA_CORRUPTION -d DEBUG_PI_LIST \
              -d SLUB_DEBUG -d ZRAM_MEMORY_TRACKING
          fi
          if [ "${{ inputs.ram_gaming }}" = "on" ]; then
            # PSI wajib untuk lmkd Android; init_on_alloc/free = zero-fill tiap alokasi (overhead CPU + bandwidth RAM)
            scripts/config --file out/.config \
              -e PSI -e MEMCG \
              -d INIT_ON_ALLOC_DEFAULT_ON -d INIT_ON_FREE_DEFAULT_ON \
              -d SHUFFLE_PAGE_ALLOCATOR
            # Speculative page fault: page fault tanpa mmap_lock (hanya kalau source punya)
            if grep -q '^config SPECULATIVE_PAGE_FAULT' mm/Kconfig; then
              scripts/config --file out/.config -e SPECULATIVE_PAGE_FAULT
            else
              echo "::warning::SPECULATIVE_PAGE_FAULT tidak ada di source ini, dilewati"
            fi
          fi
          if [ "$(cat .io_default 2>/dev/null)" = "kyber" ]; then
            scripts/config --file out/.config -e MQ_IOSCHED_KYBER
          fi
          scripts/config --file out/.config \
            -d HZ_100 -d HZ_250 -d HZ_300 -e HZ_1000 --set-val HZ 1000
          scripts/config --file out/.config -e ZRAM -e CRYPTO_LZ4 \
            -d ZRAM_DEF_COMP_LZORLE -d ZRAM_DEF_COMP_LZO -e ZRAM_DEF_COMP_LZ4
          scripts/config --file out/.config -e NET_SCH_FQ -e NET_SCH_DEFAULT \
            -d DEFAULT_PFIFO_FAST -d DEFAULT_FQ_CODEL -e DEFAULT_FQ --set-str DEFAULT_NET_SCH fq
          if [ ! -f .applied_bbr3 ]; then
            echo "::warning::BBRv3 tidak terpasang: 'bbr' di build ini masih BBRv1"
          fi
          if [ -f .applied_bbr3 ]; then
            scripts/config --file out/.config -e TCP_CONG_BBR --set-str DEFAULT_TCP_CONG bbr
          fi
          if [ -f .applied_adios ]; then
            scripts/config --file out/.config -e MQ_IOSCHED_ADIOS
          fi
          if [ "${{ inputs.gaming_tweaks }}" = "on" ]; then
            scripts/config --file out/.config \
              -d WQ_POWER_EFFICIENT_DEFAULT \
              -e CPU_FREQ_GOV_SCHEDUTIL -e CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
              -e UCLAMP_TASK -e UCLAMP_TASK_GROUP \
              -e RCU_EXPERT -e RCU_EXPEDITE_BOOT
          fi
          if grep -q '^config LRU_GEN' mm/Kconfig; then
            scripts/config --file out/.config -e LRU_GEN -e LRU_GEN_ENABLED
          else
            echo "::warning::LRU_GEN (MGLRU) tidak ada di source ini, dilewati"
          fi
          make $ARGS olddefconfig
          grep -E "^CONFIG_(LRU_GEN|TCP_CONG_BBR|MQ_IOSCHED_ADIOS|ZRAM_DEF_COMP_LZ4|DEFAULT_NET_SCH)" out/.config || true
          grep -E "^CONFIG_HZ" out/.config
          grep -E "^CONFIG_(INIT_ON_ALLOC_DEFAULT_ON|INIT_ON_FREE_DEFAULT_ON|SPECULATIVE_PAGE_FAULT|PSI|SLUB_DEBUG|DEBUG_INFO)[= ]" out/.config || true
          if grep -q '^CONFIG_LRU_GEN=y' out/.config; then
            echo "MGLRU AKTIF: $(grep -E '^CONFIG_LRU_GEN(_ENABLED)?=' out/.config | tr '\n' ' ')"
          else
            echo "::warning::MGLRU TIDAK aktif di .config akhir"
            grep -n -A14 '^config LRU_GEN' mm/Kconfig \
              || echo "mm/Kconfig tidak punya LRU_GEN: source ini belum ada MGLRU (perlu backport)"
          fi
          grep -E "^CONFIG_(LTO|CFI_CLANG|KSU|KPROBES|LOCALVERSION)" out/.config || true
          if [ "${{ inputs.kernelsu }}" != "off" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU tidak aktif"; exit 1; }
          fi
          if [ "${{ inputs.kernelsu }}" != "off" ] && [ "${{ inputs.susfs }}" = "on" ]; then
            echo "=== SUSFS config akhir ==="
            grep -E "^CONFIG_KSU_SUSFS" out/.config || true
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || {
              echo "::error::CONFIG_KSU_SUSFS tidak aktif di .config akhir (simbol Kconfig tidak ada / depend tidak terpenuhi)"
              grep -rn "config KSU_SUSFS" drivers/kernelsu/ KernelSU-Next/kernel/Kconfig fs/Kconfig 2>/dev/null | head || true
              exit 1
            }
          fi
          make $ARGS -j$(nproc) Image
          BEOF
          build_ok=0
          bash "$GITHUB_WORKSPACE/do_build.sh" && build_ok=1
          if [ "$build_ok" != 1 ] && [ -f .applied_bore ]; then
            echo "::warning::Build gagal dengan BORE, revert BORE lalu build ulang tanpa BORE"
            if [ -d "$GITHUB_WORKSPACE/bore_backup" ]; then
              cp -a "$GITHUB_WORKSPACE/bore_backup/." .
            fi
            if [ -f "$GITHUB_WORKSPACE/bore_newfiles" ]; then
              while read -r f; do rm -f "$f"; done < "$GITHUB_WORKSPACE/bore_newfiles"
            fi
            sed -i '/^CONFIG_SCHED_BORE=y$/d' arch/arm64/configs/${{ inputs.defconfig }}
            rm -f .applied_bore
            rm -rf out
            bash "$GITHUB_WORKSPACE/do_build.sh" && build_ok=1
          fi
          if [ "$build_ok" != 1 ] && [ "${{ inputs.opt_o3 }}" = "on" ]; then
            echo "::warning::Build gagal dengan -O3, build ulang dengan -O2"
            export ARGS="${ARGS/ KCFLAGS=-O3/}"
            rm -rf out
            bash "$GITHUB_WORKSPACE/do_build.sh" && build_ok=1
          fi
          [ "$build_ok" = 1 ] || { echo "::error::Build gagal"; exit 1; }

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image ak3/
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 - Kaelltzyy GKI 5.10 (tanpa cek device, kernel saja)
          properties() { '
          kernel.string=Kaelltzyy KSUN GKI 5.10
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
          cd ak3 && zip -r9 ../Kaelltzyy-GKI-5.10.zip . -x ".git*"

      - uses: actions/upload-artifact@v4
        with:
          name: Kaelltzyy-GKI-5.10
          if-no-files-found: error
          path: |
            Kaelltzyy-GKI-5.10.zip
            vendor-knobs.txt
            kernel/out/arch/arm64/boot/Image
