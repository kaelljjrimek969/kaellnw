      - name: Gaming system - IRQ jaringan/UFS ke core besar + TCP latency
        if: ${{ inputs.gaming_system == 'on' }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          # 1) IRQ wifi + UFS ikut dipindah ke cluster besar (daftar di driver Kaelltzyy)
          p = 'drivers/misc/kaelltzyy.c'
          s = open(p).read()
          a = 'strstr(name, "synaptics"))'
          if s.count(a) == 1 and '"ufshcd"' not in s:
              s = s.replace(a, 'strstr(name, "synaptics") ||\n'
                  '\t\t    strstr(name, "wlan") || strstr(name, "wifi") ||\n'
                  '\t\t    strstr(name, "cnss") || strstr(name, "ufshcd"))', 1)
              open(p, 'w').write(s)
              print('ok    IRQ wlan/wifi/cnss/ufshcd -> cluster besar')
          else:
              print('::warning::daftar IRQ di driver tidak cocok, dilewati')
          # 2) TCP small queues: 1MB -> 256KB (ping/lag stabil saat ada download)
          p = 'net/ipv4/tcp_ipv4.c'
          s = open(p).read()
          n, c = re.subn(r'(sysctl_tcp_limit_output_bytes\s*=\s*)1048576;',
                         r'\g<1>262144; /* Kaelltzyy */', s, count=1)
          if c:
              open(p, 'w').write(n); print('ok    tcp_limit_output_bytes=256K')
          else:
              print('::warning::tcp_limit_output_bytes tidak ditemukan, dilewati')
          PYEOF
          grep -n "Kaelltzyy" net/ipv4/tcp_ipv4.c | head -5

