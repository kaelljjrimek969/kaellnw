      - name: Scan knob vendor (info, untuk tuning lanjutan)
        run: |
          cd kernel
          {
            echo "### module_param/sysfs terkait performa di source (nama saja)"
            grep -rhoE 'module_param(_named|_cb)?\(\s*[A-Za-z0-9_]+' \
              drivers/misc drivers/gpu drivers/devfreq drivers/cpufreq drivers/soc drivers/scsi/ufs \
              drivers/thermal drivers/input kernel/sched 2>/dev/null \
              | sed -E 's/.*\(\s*//' | grep -iE 'boost|fpsgo|perf|game|turbo|dvfs|dvfsrc|freq|idle|latency|ged|gpu|ufs|clkgate|hibern|thermal|cci|ddr|emi' \
              | sort -u | head -300
            echo
            echo "### folder vendor MTK/Qcom yang ada"
            ls -d drivers/misc/mediatek/* drivers/gpu/mediatek/* drivers/soc/mediatek/* drivers/soc/qcom/* 2>/dev/null | head -80
            echo
