name: Build Kaelltzyy Kernel (GKI 5.10 A12)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo kernel"
        default: "Arkael-Dev/arkael-kernel-a12-5.10"
      branch:
        description: "Branch"
        default: "arkaelkernel"
      defconfig:
        description: "Defconfig"
        default: "gki_defconfig"
      schedutil_rate_limit_us:
        description: "Default schedutil rate_limit_us (kosongkan untuk skip)"
        default: "500"
      zram_size_gb:
        description: "Ukuran ZRAM dipaksa (GB, 0 atau kosong untuk skip)"
        default: "4"
      uname_release:
        description: "Default uname -r untuk app (isi string kernel stock, kosongkan untuk skip)"
        default: ""
      turbo_headroom:
        description: "Turbo schedutil: off / normal (+25%) / strong (+50%)"
        default: "normal"
      bbr3_patch_url:
        description: "URL raw patch TCP BBRv3 untuk 5.10 (kosongkan untuk skip)"
        default: ""
      adios_patch_url:
        description: "URL raw patch I/O scheduler ADIOS untuk 5.10 (kosongkan untuk skip)"
        default: ""
      touch_boost_patch_url:
        description: "URL raw patch input/touch boost (kosongkan untuk skip)"
        default: ""
      bore_patch_url:
        description: "URL raw patch BORE untuk 5.10 (kosongkan untuk skip)"
        default: ""
      kernelsu:
        description: "KernelSU-Next: latest (tag stabil terbaru) / next (branch dev) / off"
        type: choice
        options: [latest, next, off]
        default: "latest"
      gaming_tweaks:
        description: "Gaming tweaks (config perf, TCP anti-lag): on / off"
        type: choice
        options: [on, off]
        default: "on"
      opt_o3:
        description: "Compile -O3 (lebih kencang, build lebih lama, kecil kemungkinan gagal): on / off"
        type: choice
        options: ["off", "on"]
        default: "off"
      input_boost_ms:
        description: "Durasi touch boost default (ms, kosongkan untuk skip)"
        default: "200"
      input_boost_pct:
        description: "Touch boost: persen max freq (1-100, kosongkan untuk skip)"
        default: "90"
      lto_mode:
        description: "LTO: thin (default, hemat RAM) / none (paling hemat, CFI ikut dimatikan)"
        type: choice
        options: [thin, none]
        default: "thin"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h

      - name: Add swap (cegah OOM saat link LTO)
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip bc bison flex libssl-dev libelf-dev \
            rsync python3 cpio curl zstd xz-utils

      - name: Install Neutron Clang
        run: |
          mkdir -p $HOME/neutron && cd $HOME/neutron
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/neutron/bin" >> $GITHUB_PATH
          $HOME/neutron/bin/clang --version | head -1

      - name: Clone kernel
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          for i in 1 2 3 4 5; do
            rm -rf kernel
            if git clone --depth=1 --single-branch -b ${{ inputs.branch }} \
                https://github.com/${{ inputs.repo }} kernel; then
              break
            fi
            echo "::warning::clone gagal (percobaan $i/5), coba lagi..."
            [ "$i" = 5 ] && { echo "::error::clone gagal 5x"; exit 1; }
            sleep $((i * 15))
          done

      - name: Add Kaelltzyy driver (Sandevistan, Yamada, uname spoof)
        run: |
          cd kernel
          cat > drivers/misc/kaelltzyy.c <<'KZEOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * Kaelltzyy tweaks:
           *  - Sandevistan Boot: max CPU min-freq at boot, released after boot_boost_ms
           *  - Yamada input boost: CPU min-freq boost on touch
           *  - Multi target uname spoof: per-app uname release/version override
           */
          #define pr_fmt(fmt) "kaelltzyy: " fmt

          #include <linux/init.h>
          #include <linux/module.h>
          #include <linux/cpu.h>
          #include <linux/cpufreq.h>
          #include <linux/cpumask.h>
          #include <linux/pm_qos.h>
          #include <linux/workqueue.h>
          #include <linux/input.h>
          #include <linux/mutex.h>
          #include <linux/slab.h>
          #include <linux/string.h>
          #include <linux/cred.h>
          #include <linux/uidgid.h>
          #include <linux/utsname.h>
          #include <linux/mmzone.h>
          #include <linux/sched.h>
          #include <linux/irq.h>
          #include <linux/irqdesc.h>
          #include <linux/irqnr.h>
          #include <linux/interrupt.h>
          #include <linux/nodemask.h>

          static unsigned int boot_boost_ms = 60000;
          module_param(boot_boost_ms, uint, 0644);
          static unsigned int input_boost_ms = 120;
          module_param(input_boost_ms, uint, 0644);
          static unsigned int input_boost_pct = 80;
          module_param(input_boost_pct, uint, 0644);

          static unsigned int uname_uids[16];
          static int uname_nuids;
          module_param_array(uname_uids, uint, &uname_nuids, 0644);
          static char uname_release[65];
          module_param_string(uname_release, uname_release, sizeof(uname_release), 0644);
          static char uname_version[65];
          module_param_string(uname_version, uname_version, sizeof(uname_version), 0644);
          static bool uname_all_apps = true;
          module_param(uname_all_apps, bool, 0644);

          struct kz_pol {
              struct freq_qos_request boot_req;
              struct freq_qos_request input_req;
              unsigned int max_freq;
              bool init;
          };

          static struct kz_pol kz[NR_CPUS];
          static DEFINE_MUTEX(kz_lock);
          static bool boot_active = true;
          static unsigned long attach_deadline;
          static struct delayed_work attach_work;
          static struct delayed_work boot_end_work;
          static struct delayed_work input_off_work;
          static struct work_struct input_on_work;
          static struct delayed_work affinity_work;
          static struct cpumask kz_big_mask;
          static bool kz_have_big;

          /* Attach QoS requests to every cpufreq policy that has appeared so far. */
          static void kz_attach(void)
          {
              unsigned int cpu;

              for_each_possible_cpu(cpu) {
                  struct cpufreq_policy *p = cpufreq_cpu_get(cpu);
                  unsigned int first;

                  if (!p)
                      continue;
                  first = cpumask_first(p->related_cpus);
                  if (first == cpu && !kz[first].init) {
                      kz[first].max_freq = p->cpuinfo.max_freq;
                      if (freq_qos_add_request(&p->constraints, &kz[first].boot_req,
                              FREQ_QOS_MIN,
                              boot_active ? p->cpuinfo.max_freq : FREQ_QOS_MIN_DEFAULT_VALUE) < 0)
                          goto next;
                      if (freq_qos_add_request(&p->constraints, &kz[first].input_req,
                              FREQ_QOS_MIN, FREQ_QOS_MIN_DEFAULT_VALUE) < 0) {
                          freq_qos_remove_request(&kz[first].boot_req);
                          goto next;
                      }
                      kz[first].init = true;
                      pr_info("policy%u attached (max %u kHz)\n", first, kz[first].max_freq);
                  }
          next:
                  cpufreq_cpu_put(p);
              }
          }

          static void kz_attach_fn(struct work_struct *w)
          {
              mutex_lock(&kz_lock);
              kz_attach();
              mutex_unlock(&kz_lock);
              if (time_before(jiffies, attach_deadline))
                  schedule_delayed_work(&attach_work, 2 * HZ);
          }

          static void kz_boot_end_fn(struct work_struct *w)
          {
              int i;

              mutex_lock(&kz_lock);
              boot_active = false;
              for (i = 0; i < NR_CPUS; i++)
                  if (kz[i].init)
                      freq_qos_update_request(&kz[i].boot_req, FREQ_QOS_MIN_DEFAULT_VALUE);
              mutex_unlock(&kz_lock);
              pr_info("Sandevistan boot boost released\n");
          }

          static void kz_input_on_fn(struct work_struct *w)
          {
              unsigned int pct = min_t(unsigned int, input_boost_pct, 100);
              int i;

              if (!input_boost_ms)
                  return;
              mutex_lock(&kz_lock);
              for (i = 0; i < NR_CPUS; i++)
                  if (kz[i].init)
                      freq_qos_update_request(&kz[i].input_req, kz[i].max_freq / 100 * pct);
              mutex_unlock(&kz_lock);
              mod_delayed_work(system_wq, &input_off_work, msecs_to_jiffies(input_boost_ms));
          }

          static void kz_input_off_fn(struct work_struct *w)
          {
              int i;

              mutex_lock(&kz_lock);
              for (i = 0; i < NR_CPUS; i++)
                  if (kz[i].init)
                      freq_qos_update_request(&kz[i].input_req, FREQ_QOS_MIN_DEFAULT_VALUE);
              mutex_unlock(&kz_lock);
          }

          static void kz_input_event(struct input_handle *h, unsigned int type,
                                     unsigned int code, int value)
          {
              if ((type == EV_ABS && code == ABS_MT_TRACKING_ID && value >= 0) ||
                  (type == EV_KEY && code == BTN_TOUCH && value == 1))
                  queue_work(system_highpri_wq, &input_on_work);
          }

          static int kz_input_connect(struct input_handler *handler, struct input_dev *dev,
                                      const struct input_device_id *id)
          {
              struct input_handle *handle;
              int ret;

              handle = kzalloc(sizeof(*handle), GFP_KERNEL);
              if (!handle)
                  return -ENOMEM;
              handle->dev = dev;
              handle->handler = handler;
              handle->name = "kaelltzyy_boost";
              ret = input_register_handle(handle);
              if (ret)
                  goto err;
              ret = input_open_device(handle);
              if (ret)
                  goto unreg;
              return 0;
          unreg:
              input_unregister_handle(handle);
          err:
              kfree(handle);
              return ret;
          }

          static void kz_input_disconnect(struct input_handle *handle)
          {
              input_close_device(handle);
              input_unregister_handle(handle);
              kfree(handle);
          }

          static const struct input_device_id kz_ids[] = {
              {
                  .flags = INPUT_DEVICE_ID_MATCH_EVBIT | INPUT_DEVICE_ID_MATCH_ABSBIT,
                  .evbit = { BIT_MASK(EV_ABS) },
                  .absbit = { [BIT_WORD(ABS_MT_POSITION_X)] =
                      BIT_MASK(ABS_MT_POSITION_X) | BIT_MASK(ABS_MT_POSITION_Y) },
              },
              { },
          };

          static struct input_handler kz_input_handler = {
              .event      = kz_input_event,
              .connect    = kz_input_connect,
              .disconnect = kz_input_disconnect,
              .name       = "kaelltzyy_boost",
              .id_table   = kz_ids,
          };

          static void kz_apply_uname(struct new_utsname *u)
          {
              if (uname_release[0])
                  strscpy(u->release, uname_release, sizeof(u->release));
              if (uname_version[0])
                  strscpy(u->version, uname_version, sizeof(u->version));
          }

          /* Called from newuname(): listed app ids, or every app (uid >= 10000) if none listed. */
          void kaelltzyy_spoof_uname(struct new_utsname *u)
          {
              uid_t appid = from_kuid(&init_user_ns, current_uid()) % 100000;
              int i, n = READ_ONCE(uname_nuids);

              if (!uname_release[0] && !uname_version[0])
                  return;
              if (n <= 0) {
                  if (uname_all_apps && appid >= 10000)
                      kz_apply_uname(u);
                  return;
              }
              for (i = 0; i < n && i < ARRAY_SIZE(uname_uids); i++) {
                  if (uname_uids[i] == appid) {
                      kz_apply_uname(u);
                      return;
                  }
              }
          }

          /* Kureiji Ollie: kswapd + touch/GPU IRQ to the fastest cluster. */
          static void kz_affinity_fn(struct work_struct *w)
          {
              unsigned int cpu, maxf = 0, irq;
              int nid;

              for_each_possible_cpu(cpu) {
                  struct cpufreq_policy *p = cpufreq_cpu_get(cpu);

                  if (!p)
                      continue;
                  if (p->cpuinfo.max_freq > maxf) {
                      maxf = p->cpuinfo.max_freq;
                      cpumask_copy(&kz_big_mask, p->related_cpus);
                      kz_have_big = true;
                  }
                  cpufreq_cpu_put(p);
              }
              if (!kz_have_big)
                  return;

              for_each_online_node(nid) {
                  pg_data_t *pgdat = NODE_DATA(nid);

                  if (pgdat && pgdat->kswapd)
                      set_cpus_allowed_ptr(pgdat->kswapd, &kz_big_mask);
              }

              for (irq = 0; irq < nr_irqs; irq++) {
                  struct irq_desc *desc = irq_to_desc(irq);
                  const char *name;

                  if (!desc || !desc->action)
                      continue;
                  name = desc->action->name;
                  if (!name)
                      continue;
                  if (strstr(name, "touch") || strstr(name, "tpd") ||
                      strstr(name, "mali") || strstr(name, "gpu"))
                      irq_set_affinity(irq, &kz_big_mask);
              }
              pr_info("kswapd/irq affinity applied\n");
          }

          static int __init kz_init(void)
          {
              INIT_DELAYED_WORK(&attach_work, kz_attach_fn);
              INIT_DELAYED_WORK(&boot_end_work, kz_boot_end_fn);
              INIT_DELAYED_WORK(&input_off_work, kz_input_off_fn);
              INIT_WORK(&input_on_work, kz_input_on_fn);
              INIT_DELAYED_WORK(&affinity_work, kz_affinity_fn);
              schedule_delayed_work(&affinity_work, 60 * HZ);

              if (!boot_boost_ms)
                  boot_active = false;
              attach_deadline = jiffies + 300 * HZ;
              schedule_delayed_work(&attach_work, HZ);
              if (boot_boost_ms)
                  schedule_delayed_work(&boot_end_work, msecs_to_jiffies(boot_boost_ms));
              if (input_register_handler(&kz_input_handler))
                  pr_warn("input handler registration failed\n");
              return 0;
          }
          late_initcall(kz_init);
          KZEOF

          cat > inject_kz.py <<'PYEOF'
          p = 'kernel/sys.c'
          s = open(p).read()
          if 'kaelltzyy_spoof_uname' not in s:
              m = s.index('SYSCALL_DEFINE1(newuname')
              decl = ('#ifdef CONFIG_KAELLTZYY\n'
                      'extern void kaelltzyy_spoof_uname(struct new_utsname *u);\n'
                      '#else\n'
                      'static inline void kaelltzyy_spoof_uname(struct new_utsname *u) {}\n'
                      '#endif\n\n')
              s = s[:m] + decl + s[m:]
              i = s.index('SYSCALL_DEFINE1(newuname')
              j = s.index('up_read(&uts_sem);', i) + len('up_read(&uts_sem);')
              s = s[:j] + '\n\tkaelltzyy_spoof_uname(&tmp);' + s[j:]
              open(p, 'w').write(s)

          p = 'drivers/misc/Makefile'
          s = open(p).read()
          if 'kaelltzyy' not in s:
              open(p, 'a').write('\nobj-$(CONFIG_KAELLTZYY)\t+= kaelltzyy.o\n')

          p = 'drivers/misc/Kconfig'
          s = open(p).read()
          if 'KAELLTZYY' not in s:
              cfg = ('config KAELLTZYY\n'
                     '\tbool "Kaelltzyy tweaks (boot boost, input boost, uname spoof)"\n'
                     '\tdepends on CPU_FREQ\n'
                     '\tdefault y\n\n')
              k = s.rindex('endmenu')
              open(p, 'w').write(s[:k] + cfg + s[k:])
          PYEOF
          python3 inject_kz.py
          grep -n kaelltzyy kernel/sys.c drivers/misc/Makefile | head

      - name: Yamada schedutil rate limit
        if: ${{ inputs.schedutil_rate_limit_us != '' }}
        run: |
          cd kernel
          f=kernel/sched/cpufreq_schedutil.c
          pat='tunables->rate_limit_us = cpufreq_policy_transition_delay_us(policy);'
          if grep -qF "$pat" "$f"; then
            sed -i "s|tunables->rate_limit_us = cpufreq_policy_transition_delay_us(policy);|tunables->rate_limit_us = ${{ inputs.schedutil_rate_limit_us }};|" "$f"
            grep -n "rate_limit_us = " "$f"
          else
            echo "::warning::Baris rate_limit_us tidak ditemukan, dilewati"
          fi

      - name: Uname spoof default release
        if: ${{ inputs.uname_release != '' }}
        env:
          REL: ${{ inputs.uname_release }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import os
          p = 'drivers/misc/kaelltzyy.c'
          s = open(p).read()
          rel = os.environ['REL'].replace('\\', '').replace('"', '')[:64]
          old = 'static char uname_release[65];'
          assert old in s
          s = s.replace(old, 'static char uname_release[65] = "' + rel + '";')
          open(p, 'w').write(s)
          print('uname_release default =', rel)
          PYEOF

      - name: Touch boost defaults (Yamada)
        if: ${{ inputs.input_boost_ms != '' || inputs.input_boost_pct != '' }}
        env:
          MS: ${{ inputs.input_boost_ms }}
          PCT: ${{ inputs.input_boost_pct }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import os
          p = 'drivers/misc/kaelltzyy.c'
          s = open(p).read()
          for key, env, lo, hi in (('input_boost_ms', 'MS', 1, 2000), ('input_boost_pct', 'PCT', 1, 100)):
              v = os.environ.get(env, '').strip()
              if not v:
                  continue
              n = max(lo, min(hi, int(v)))
              old = 'static unsigned int %s = ' % key
              i = s.index(old)
              j = s.index(';', i)
              s = s[:i] + old + str(n) + s[j:]
              print(key, '=', n)
          open(p, 'w').write(s)
          PYEOF
          grep -nE "input_boost_(ms|pct) =" drivers/misc/kaelltzyy.c

      - name: Force ZRAM disksize
        if: ${{ inputs.zram_size_gb != '' && inputs.zram_size_gb != '0' }}
        env:
          GB: ${{ inputs.zram_size_gb }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import os
          gb = int(os.environ['GB'])
          p = 'drivers/block/zram/zram_drv.c'
          s = open(p).read()
          old = 'disksize = memparse(buf, NULL);'
          assert old in s, 'baris disksize tidak ditemukan'
          new = old + ' if (disksize) disksize = %dULL << 30; /* Kaelltzyy zram */' % gb
          s = s.replace(old, new, 1)
          open(p, 'w').write(s)
          print('zram disksize dipaksa', gb, 'GB')
          PYEOF

      - name: Kernel-level memory defaults
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          def patch(path, pairs):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  print('MISSING', path); return
              n = s
              for old, new in pairs:
                  n = n.replace(old, new)
              if n != s:
                  open(path, 'w').write(n); print('patched', path)
              else:
                  print('::warning::tidak ada perubahan di', path)
          patch('mm/swap.c', [('page_cluster = 3;', 'page_cluster = 0;'),
                              ('page_cluster = 2;', 'page_cluster = 0;')])
          patch('fs/dcache.c', [('int sysctl_vfs_cache_pressure __read_mostly = 100;',
                                 'int sysctl_vfs_cache_pressure __read_mostly = 50;')])
          patch('mm/swap_state.c', [('static bool enable_vma_readahead __read_mostly = true;',
                                     'static bool enable_vma_readahead __read_mostly = false;')])
          patch('include/linux/mm.h', [('(SZ_128K / PAGE_SIZE)', '(SZ_512K / PAGE_SIZE)')])
          PYEOF

      - name: Turbo schedutil (extra frequency headroom)
        if: ${{ inputs.turbo_headroom != 'off' }}
        run: |
          cd kernel
          f=kernel/sched/cpufreq_schedutil.c
          pat='freq = map_util_freq(util, freq, max);'
          if grep -qF "$pat" "$f"; then
            case "${{ inputs.turbo_headroom }}" in
              strong) extra='freq += freq >> 1;' ;;
              *)      extra='freq += freq >> 2;' ;;
            esac
            sed -i "s|freq = map_util_freq(util, freq, max);|{ freq = map_util_freq(util, freq, max); ${extra} /* Kaelltzyy turbo */ }|" "$f"
            grep -n "Kaelltzyy turbo" "$f"
          else
            echo "::warning::Baris map_util_freq tidak ditemukan, turbo dilewati"
          fi

      - name: Force TCP_NODELAY by default
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = 'net/ipv4/tcp.c'
          s = open(p).read()
          if 'Kaelltzyy nodelay' not in s:
              i = s.index('void tcp_init_sock(struct sock *sk)')
              key = 'tp->out_of_order_queue = RB_ROOT;'
              j = s.index(key, i) + len(key)
              s = s[:j] + '\n\ttp->nonagle |= TCP_NAGLE_OFF; /* Kaelltzyy nodelay */' + s[j:]
              open(p, 'w').write(s)
              print('nodelay patched')
          PYEOF
          grep -n "Kaelltzyy nodelay" net/ipv4/tcp.c

      - name: Add Kaelltzyy cpufreq governor (copy of performance)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re, sys
          src = 'drivers/cpufreq/cpufreq_performance.c'
          s = open(src).read()
          # buang blok default governor milik performance (supaya tidak dobel definisi)
          s = re.sub(r'#ifdef\s+CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE.*?#endif\n?', '', s, flags=re.S)
          s = s.replace('cpufreq_gov_performance', 'cpufreq_gov_kaelltzyy')
          s = s.replace('"performance"', '"kaelltzyy"').replace("'performance'", "'kaelltzyy'")
          assert 'cpufreq_default_governor' not in s, 'blok default governor masih ada'
          assert '.name' in s and '"kaelltzyy"' in s

          kc = 'drivers/cpufreq/Kconfig'
          k = open(kc).read()
          mk = 'drivers/cpufreq/Makefile'
          m = open(mk).read()
          anchor = 'config CPU_FREQ_GOV_POWERSAVE'
          if anchor not in k:
              print('::warning::Anchor Kconfig governor tidak ditemukan, governor Kaelltzyy dilewati')
              sys.exit(0)
          if 'CPU_FREQ_GOV_KAELLTZYY' not in k:
              cfg = ('config CPU_FREQ_GOV_KAELLTZYY\n'
                     '\tbool "\'kaelltzyy\' governor (performance clone)"\n'
                     '\tdepends on CPU_FREQ\n'
                     '\tdefault y\n'
                     '\thelp\n'
                     '\t  Kaelltzyy governor: statically pins CPU frequency to policy max.\n\n')
              k = k.replace(anchor, cfg + anchor, 1)
              open(kc, 'w').write(k)
          if 'cpufreq_kaelltzyy' not in m:
              open(mk, 'a').write('\nobj-$(CONFIG_CPU_FREQ_GOV_KAELLTZYY)\t+= cpufreq_kaelltzyy.o\n')
          open('drivers/cpufreq/cpufreq_kaelltzyy.c', 'w').write(s)
          print('governor kaelltzyy ditambahkan')
          PYEOF
          grep -n "kaelltzyy" drivers/cpufreq/cpufreq_kaelltzyy.c drivers/cpufreq/Makefile | head

      - name: Apply BORE patch
        if: ${{ inputs.bore_patch_url != '' }}
        run: |
          cd kernel
          P="$GITHUB_WORKSPACE/bore.patch"
          B="$GITHUB_WORKSPACE/bore_backup"
          NF="$GITHUB_WORKSPACE/bore_newfiles"
          rm -rf "$B" "$NF"; mkdir -p "$B"
          if ! curl -fL --retry 3 "${{ inputs.bore_patch_url }}" -o "$P"; then
            echo "::warning::Download patch BORE gagal, dilewati"; exit 0
          fi
          if head -c 300 "$P" | grep -qiE '<html|<!doctype'; then
            echo "::warning::URL BORE mengembalikan HTML (pakai link raw, bukan blob), dilewati"; exit 0
          fi
          # backup file yang disentuh patch, supaya bisa di-revert kalau build gagal
          grep -E '^\+\+\+ ' "$P" | awk '{print $2}' | sed 's|^[ab]/||' | grep -v '^/dev/null$' | sort -u | \
          while read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "$B/$(dirname "$f")"; cp -p "$f" "$B/$f"
            else
              echo "$f" >> "$NF"
            fi
          done
          ok=0
          if git apply --check "$P" 2>/dev/null; then
            git apply "$P" && ok=1
          elif patch -p1 -F3 --no-backup-if-mismatch --dry-run < "$P" >/dev/null 2>&1; then
            echo "git apply gagal, pakai patch -F3 (fuzz)"
            patch -p1 -F3 --no-backup-if-mismatch < "$P" && ok=1
          else
            git apply --check "$P" 2>&1 | head -20 || true
          fi
          if [ "$ok" != 1 ]; then
            echo "::warning::Patch BORE tidak cocok dengan source ini, dilewati"; exit 0
          fi
          if grep -rqE '^config SCHED_BORE' init/Kconfig kernel/Kconfig* kernel/sched 2>/dev/null; then
            echo "CONFIG_SCHED_BORE=y" >> arch/arm64/configs/${{ inputs.defconfig }}
          else
            echo "::warning::Kconfig SCHED_BORE tidak ditemukan, patch dianggap selalu aktif"
          fi
          touch .applied_bore
          echo "BORE terpasang"

      - name: Apply BBRv3 patch
        if: ${{ inputs.bbr3_patch_url != '' }}
        run: |
          cd kernel
          if curl -fL --retry 3 "${{ inputs.bbr3_patch_url }}" -o bbr3.patch \
              && git apply --check bbr3.patch && git apply bbr3.patch; then
            touch .applied_bbr3
          else
            echo "::warning::Patch BBRv3 gagal dipasang (URL salah / tidak cocok), dilewati"
          fi

      - name: Apply ADIOS patch
        if: ${{ inputs.adios_patch_url != '' }}
        run: |
          cd kernel
          if curl -fL --retry 3 "${{ inputs.adios_patch_url }}" -o adios.patch \
              && git apply --check adios.patch && git apply adios.patch; then
            touch .applied_adios
          else
            echo "::warning::Patch ADIOS gagal dipasang (URL salah / tidak cocok), dilewati"
          fi

      - name: Apply touch boost patch
        if: ${{ inputs.touch_boost_patch_url != '' }}
        run: |
          cd kernel
          if curl -fL --retry 3 "${{ inputs.touch_boost_patch_url }}" -o touch_boost.patch \
              && git apply --check touch_boost.patch && git apply touch_boost.patch; then
            echo "touch boost terpasang"
          else
            echo "::warning::Patch touch boost gagal dipasang (URL salah / tidak cocok), dilewati"
          fi

      - name: Gaming network defaults (anti-lag)
        if: ${{ inputs.gaming_tweaks == 'on' }}
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          p = 'net/ipv4/tcp_ipv4.c'
          s = open(p).read()
          n, c1 = re.subn(r'(net->ipv4\.sysctl_tcp_slow_start_after_idle\s*=\s*)1;',
                          r'\g<1>0; /* Kaelltzyy gaming */', s)
          n, c2 = re.subn(r'(net->ipv4\.sysctl_tcp_fastopen\s*=\s*)TFO_CLIENT_ENABLE;',
                          r'\g<1>TFO_CLIENT_ENABLE | TFO_SERVER_ENABLE; /* Kaelltzyy gaming */', n)
          if c1 + c2:
              open(p, 'w').write(n)
          print('slow_start_after_idle=0:', bool(c1), '| fastopen=3:', bool(c2))
          if not c1:
              print('::warning::slow_start_after_idle tidak ditemukan, dilewati')
          if not c2:
              print('::warning::tcp_fastopen default tidak ditemukan, dilewati')
          PYEOF

      - name: Integrate KernelSU-Next
        if: ${{ inputs.kernelsu != 'off' }}
        run: |
          cd kernel
          URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          if [ "${{ inputs.kernelsu }}" = "next" ]; then
            curl -fLSs --retry 5 --retry-all-errors "$URL" | bash -s next
          else
            curl -fLSs --retry 5 --retry-all-errors "$URL" | bash -
          fi
          ls -la drivers | grep -i kernelsu
          git -C KernelSU-Next log -1 --oneline
          git -C KernelSU-Next describe --tags --always

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64 KBUILD_BUILD_USER=kaelltzyy KBUILD_BUILD_HOST=github
          export ARGS="O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          if [ "${{ inputs.opt_o3 }}" = "on" ]; then export ARGS="$ARGS KCFLAGS=-O3"; fi
          cat > "$GITHUB_WORKSPACE/do_build.sh" <<'BEOF'
          set -e
          make $ARGS ${{ inputs.defconfig }}
          LVN="-Kaelltzyy"
          if [ "${{ inputs.kernelsu }}" != "off" ]; then LVN="-Kaelltzyy-KSUN"; fi
          scripts/config --file out/.config --set-str LOCALVERSION "$LVN" -d LOCALVERSION_AUTO
          if [ "${{ inputs.lto_mode }}" = "none" ]; then
            scripts/config --file out/.config \
              -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE -d CFI_CLANG
          else
            scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          fi
          if [ "${{ inputs.kernelsu }}" != "off" ]; then
            scripts/config --file out/.config \
              -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          fi
          scripts/config --file out/.config \
            -d HZ_100 -d HZ_250 -d HZ_300 -e HZ_1000 --set-val HZ 1000
          scripts/config --file out/.config -e ZRAM -e CRYPTO_LZ4 \
            -d ZRAM_DEF_COMP_LZORLE -d ZRAM_DEF_COMP_LZO -e ZRAM_DEF_COMP_LZ4
          scripts/config --file out/.config -e NET_SCH_FQ -e NET_SCH_DEFAULT \
            -d DEFAULT_PFIFO_FAST -d DEFAULT_FQ_CODEL -e DEFAULT_FQ --set-str DEFAULT_NET_SCH fq
          if [ ! -f .applied_bbr3 ]; then
            echo "::warning::BBRv3 tidak terpasang: 'bbr' di build ini masih BBRv1"
          fi
          if [ -f .applied_bbr3 ]; then
            scripts/config --file out/.config -e TCP_CONG_BBR --set-str DEFAULT_TCP_CONG bbr
          fi
          if [ -f .applied_adios ]; then
            scripts/config --file out/.config -e MQ_IOSCHED_ADIOS
          fi
          if [ "${{ inputs.gaming_tweaks }}" = "on" ]; then
            scripts/config --file out/.config \
              -d WQ_POWER_EFFICIENT_DEFAULT \
              -e CPU_FREQ_GOV_SCHEDUTIL -e CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
              -e UCLAMP_TASK -e UCLAMP_TASK_GROUP
          fi
          scripts/config --file out/.config -e CPU_FREQ_GOV_PERFORMANCE -e CPU_FREQ_GOV_KAELLTZYY
          make $ARGS olddefconfig
          grep -E "^CONFIG_(TCP_CONG_BBR|MQ_IOSCHED_ADIOS|ZRAM_DEF_COMP_LZ4|DEFAULT_NET_SCH)" out/.config || true
          grep -E "^CONFIG_HZ" out/.config
          grep -E "^CONFIG_(LTO|CFI_CLANG|KSU|KPROBES|LOCALVERSION)" out/.config || true
          if [ "${{ inputs.kernelsu }}" != "off" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU tidak aktif"; exit 1; }
          fi
          make $ARGS -j$(nproc) Image
          BEOF
          if ! bash "$GITHUB_WORKSPACE/do_build.sh"; then
            if [ -f .applied_bore ]; then
              echo "::warning::Build gagal dengan BORE, revert BORE lalu build ulang tanpa BORE"
              if [ -d "$GITHUB_WORKSPACE/bore_backup" ]; then
                cp -a "$GITHUB_WORKSPACE/bore_backup/." .
              fi
              if [ -f "$GITHUB_WORKSPACE/bore_newfiles" ]; then
                while read -r f; do rm -f "$f"; done < "$GITHUB_WORKSPACE/bore_newfiles"
              fi
              sed -i '/^CONFIG_SCHED_BORE=y$/d' arch/arm64/configs/${{ inputs.defconfig }}
              rm -f .applied_bore
              rm -rf out
              bash "$GITHUB_WORKSPACE/do_build.sh"
            else
              exit 1
            fi
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image ak3/
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 - Kaelltzyy GKI 5.10 (tanpa cek device, kernel saja)
          properties() { '
          kernel.string=Kaelltzyy KSUN GKI 5.10
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
          cd ak3 && zip -r9 ../Kaelltzyy-GKI-5.10.zip . -x ".git*"

      - uses: actions/upload-artifact@v4
        with:
          name: Kaelltzyy-GKI-5.10
          path: |
            Kaelltzyy-GKI-5.10.zip
            kernel/out/arch/arm64/boot/Image
